apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-proxy
  name: nginx-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "nginx-proxy"
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-basic-auth
      containers:
      - name: nginx-proxy
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{.Values.image.pullPolicy | default "IfNotPresent"}}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx-basic-auth.conf
      affinity:
      {{- toYaml .Values.affinity | nindent 8 -}}